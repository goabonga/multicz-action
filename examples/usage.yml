# Reference workflow showing the most common multicz pattern, gated by
# `multicz changed`. Drop into `.github/workflows/release.yml` (or split
# across multiple workflows) and adapt the `build` matrix to your project.
#
# Uses the multicz-action sub-actions:
#   - goabonga/multicz-action/changed@v1   for matrix gating
#   - goabonga/multicz-action/bump@v1      for the actual release
#
# Each sub-action auto-installs multicz on the runner if it's not already
# on PATH; you don't need a separate setup step.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List changed components
        id: changed
        uses: goabonga/multicz-action/changed@v1
        with:
          output: json

      - name: Extract array for matrix
        id: list
        env:
          CHANGED_JSON: ${{ steps.changed.outputs.json }}
        run: |
          set -euo pipefail
          echo "list=$(echo "$CHANGED_JSON" | jq -c '.changed')" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.list != '[]'
    strategy:
      matrix:
        component: ${{ fromJson(needs.detect.outputs.list) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "building ${{ matrix.component }}"

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT needed to push back through branch protection.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git as bot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: goabonga/multicz-action/bump@v1
        with:
          commit: 'true'
          tag: 'true'
          push: 'true'
