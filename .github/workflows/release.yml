# Triggered when a `vX.Y.Z` tag is pushed (typically by `multicz bump
# --commit --tag` followed by `git push --follow-tags`). Moves the
# floating major tag (`vX`) so consumers using `@v1` always pick up
# the latest patch / minor automatically.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move floating major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" "$TAG" -m "Latest $MAJOR release"
          git push origin "$MAJOR" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
