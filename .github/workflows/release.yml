# Release pipeline driven by multicz itself (dogfooding the sub-actions
# from this very repo via `uses: ./<command>`).
#
# Trigger:    completion of the `ci` workflow on main (success only)
# Skip when:  HEAD is the bot's own release commit (loop guard)
# Flow:
#   1. install multicz (top-level action)
#   2. attribute the release commit to the upstream pusher
#   3. (optional) import a GPG key and sign commit + tags
#   4. `./plan` with output: json - exit cleanly if nothing pending
#   5. `./bump` with commit/tag/push/sign - multicz writes VERSION +
#      CHANGELOG.md, commits, tags, pushes
#   6. move the floating major tag (`vX`) so consumers using `@v1`
#      track the latest patch / minor automatically
#   7. `./release-notes --tag <new-tag>` and feed it to `gh release create`
#
# Optional GPG signing: define repository secrets `GPG_PRIVATE_KEY`
# (ASCII-armored, e.g. `gpg --armor --export-secret-keys`) and
# `GPG_PASSPHRASE` to sign the release commit and tag. When either
# secret is missing the pipeline still runs, just unsigned.

name: release

on:
  # Trigger only after the `ci` workflow finishes on `main`. The `if:`
  # below filters on success, so a red CI never produces a release.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Two guards on the same `if`:
    #   1. CI must have actually succeeded.
    #   2. Don't recurse on the bot's own release push.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # PAT bypasses branch protection on main; falls back to the
          # workflow token for repos without protection rules.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Install multicz
        uses: ./

      - name: Configure git
        # Attribute the release commit to whoever pushed the head commit
        # that triggered CI, so the chain "Bob pushed feat: X" ->
        # "Bob authored chore(release): bump X -> Y" is preserved on the
        # timeline. Falls back to the github-actions[bot] noreply
        # identity when the upstream payload doesn't carry an author.
        run: |
          NAME="${{ github.event.workflow_run.head_commit.author.name }}"
          EMAIL="${{ github.event.workflow_run.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        # Secrets can't be referenced from `if:` directly, so we
        # promote their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: Plan
        id: plan
        uses: ./plan
        with:
          output: json

      - name: Detect if release pending
        id: pending
        env:
          PLAN_JSON: ${{ steps.plan.outputs.json }}
        run: |
          set -euo pipefail
          if [ "$(echo "$PLAN_JSON" | jq '.bumps | length')" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push
        if: steps.pending.outputs.release == 'true'
        uses: ./bump
        with:
          commit: 'true'
          tag: 'true'
          push: 'true'
          sign: ${{ steps.gpg.outputs.available }}

      - name: Capture new tag
        if: steps.pending.outputs.release == 'true'
        id: tag
        run: |
          set -euo pipefail
          # Single component → exactly one `vX.Y.Z` tag at HEAD.
          TAG=$(git tag --points-at HEAD --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Move floating major tag
        if: steps.pending.outputs.release == 'true'
        env:
          GPG_AVAILABLE: ${{ steps.gpg.outputs.available }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"
          if [ "$GPG_AVAILABLE" = "true" ]; then
            git tag -fas "$MAJOR" "$TAG" -m "Latest $MAJOR release"
          else
            git tag -fa  "$MAJOR" "$TAG" -m "Latest $MAJOR release"
          fi
          git push origin "$MAJOR" --force

      - name: Generate release notes
        if: steps.pending.outputs.release == 'true'
        id: notes
        uses: ./release-notes
        with:
          tag: ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.stdout }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTES" > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
