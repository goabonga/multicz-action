name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: smoke (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use the action against itself
        uses: ./
      - name: multicz is on PATH
        run: |
          which multicz
          multicz --version
          multicz --help

  pinned:
    name: smoke (pinned version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          version: '0.4.0'
      - name: multicz reports the pinned version
        run: |
          multicz --version | grep -F '0.4.0'

  python-versions:
    name: smoke (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          python-version: ${{ matrix.python }}
      - run: multicz --version

  shellcheck:
    name: shellcheck composite actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract embedded shell + run shellcheck
        # actionlint only parses workflow YAML, not composite action.yml —
        # so we extract the `run:` blocks ourselves. PyYAML walks the
        # structure (a regex breaks on blank lines inside a `run: |`
        # block, swallowing the rest of the script). GHA `${{ ... }}`
        # expressions are masked to `$GHA_EXPR` (a single declared
        # variable) so shellcheck doesn't flag them as either bash
        # variables or string constants.
        run: |
          set -euo pipefail
          python3 - > /tmp/snippets.sh <<'PY'
          import glob, pathlib, re, yaml

          def walk(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == "run" and isinstance(v, str):
                          yield v
                      else:
                          yield from walk(v)
              elif isinstance(node, list):
                  for x in node:
                      yield from walk(x)

          print("#!/usr/bin/env bash")
          print('GHA_EXPR="${1:-}"  # masked stand-in for ${{ ... }} expressions')
          print()
          for path in sorted(glob.glob("action.yml") + glob.glob("*/action.yml")):
              doc = yaml.safe_load(pathlib.Path(path).read_text())
              for script in walk(doc):
                  masked = re.sub(r"\$\{\{.*?\}\}", "$GHA_EXPR", script)
                  print(f"# === {path} ===")
                  print(masked)
                  print()
          PY
          shellcheck -s bash /tmp/snippets.sh
