name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: smoke (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use the action against itself
        uses: ./
      - name: multicz is on PATH
        run: |
          which multicz
          multicz --version
          multicz --help

  pinned:
    name: smoke (pinned version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          version: '0.4.0'
      - name: multicz reports the pinned version
        run: |
          multicz --version | grep -F '0.4.0'

  python-versions:
    name: smoke (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          python-version: ${{ matrix.python }}
      - run: multicz --version

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint workflows and composite actions
        # actionlint is the canonical linter for GitHub Actions YAML.
        # It runs shellcheck on every `run:` block across workflows and
        # composite actions, masking `${{ ... }}` expressions properly
        # (which a raw shellcheck invocation can't do). One pass covers
        # every `*/action.yml` plus the workflows in `.github/workflows/`.
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml action.yml */action.yml
