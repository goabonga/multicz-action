name: 'multicz plan'
description: 'Run `multicz plan` with structured inputs and outputs.'
author: 'Chris <goabonga@pm.me>'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  output:
    description: 'text | json [default: text]. (--output)'
    required: false
    default: ''
  pre:
    description: 'Plan as if invoked with `bump --pre <label>`. (--pre)'
    required: false
    default: ''
  finalize:
    description: 'Plan as if invoked with `bump --finalize`. (--finalize, boolean)'
    required: false
    default: 'false'
  since:
    description: "Override the commit window: use this ref instead of each component's last tag. (--since)"
    required: false
    default: ''
  force:
    description: 'Force-bump <name>:<kind>. Repeatable (one entry per line). (--force)'
    required: false
    default: ''
  summary:
    description: 'Append a markdown summary of the plan to this file. (--summary)'
    required: false
    default: ''

  multicz-version:
    description: 'multicz version to install if not already on PATH (PyPI specifier, or "latest")'
    required: false
    default: 'latest'

outputs:
  stdout:
    description: "Raw stdout from the multicz invocation"
    value: ${{ steps.run.outputs.stdout }}
  json:
    description: "JSON payload (only set when output: json)"
    value: ${{ steps.run.outputs.json }}

runs:
  using: 'composite'
  steps:
    - name: Ensure multicz is installed
      shell: bash
      run: |
        if ! command -v multicz >/dev/null 2>&1; then
          echo "multicz not on PATH - installing via uv"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ inputs.multicz-version }}" = "latest" ]; then
            uv tool install multicz
          else
            uv tool install "multicz==${{ inputs.multicz-version }}"
          fi
        fi
        multicz --version

    - name: Run multicz plan
      id: run
      shell: bash
      run: |
        set -euo pipefail
        ARGS=()

        # value flags
        if [ -n "${{ inputs.output }}" ]; then ARGS+=("--output" "${{ inputs.output }}"); fi
        if [ -n "${{ inputs.pre }}" ]; then ARGS+=("--pre" "${{ inputs.pre }}"); fi
        if [ -n "${{ inputs.since }}" ]; then ARGS+=("--since" "${{ inputs.since }}"); fi
        if [ -n "${{ inputs.summary }}" ]; then ARGS+=("--summary" "${{ inputs.summary }}"); fi

        # boolean flags
        if [ "${{ inputs.finalize }}" = "true" ]; then ARGS+=("--finalize"); fi

        # repeatable flags
        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=("--force" "$line")
        done <<< "${{ inputs.force }}"

        # short-flag aliases skipped: -o (--output)

        multicz plan "${ARGS[@]}" | tee /tmp/multicz-output.txt

        {
          echo "stdout<<EOF_STDOUT"
          cat /tmp/multicz-output.txt
          echo "EOF_STDOUT"
        } >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.output }}" = "json" ]; then
          {
            echo "json<<EOF_JSON"
            cat /tmp/multicz-output.txt
            echo "EOF_JSON"
          } >> "$GITHUB_OUTPUT"
        fi
