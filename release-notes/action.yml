name: 'multicz release-notes'
description: 'Run `multicz release-notes` with structured inputs and outputs.'
author: 'Chris <goabonga@pm.me>'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  component:
    description: 'Component to render notes for. Required unless `all` is true or `tag` is set. (positional COMPONENT)'
    required: false
    default: ''
  all:
    description: 'Render notes for every component with a planned bump. (--all, boolean)'
    required: false
    default: 'false'
  tag:
    description: 'Render notes for a past release tag (e.g. api-v1.3.0). (--tag)'
    required: false
    default: ''
  output:
    description: 'md | text | json [default: md]. (--output)'
    required: false
    default: ''

  multicz-version:
    description: 'multicz version to install if not already on PATH (PyPI specifier, or "latest")'
    required: false
    default: 'latest'

outputs:
  stdout:
    description: "Raw stdout from the multicz invocation"
    value: ${{ steps.run.outputs.stdout }}
  json:
    description: "JSON payload (only set when output: json)"
    value: ${{ steps.run.outputs.json }}

runs:
  using: 'composite'
  steps:
    - name: Ensure multicz is installed
      shell: bash
      run: |
        if ! command -v multicz >/dev/null 2>&1; then
          echo "multicz not on PATH — installing via uv"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ inputs.multicz-version }}" = "latest" ]; then
            uv tool install multicz
          else
            uv tool install "multicz==${{ inputs.multicz-version }}"
          fi
        fi
        multicz --version

    - name: Run multicz release-notes
      id: run
      shell: bash
      run: |
        set -euo pipefail
        ARGS=()

        # value flags
        if [ -n "${{ inputs.tag }}" ]; then ARGS+=("--tag" "${{ inputs.tag }}"); fi
        if [ -n "${{ inputs.output }}" ]; then ARGS+=("--output" "${{ inputs.output }}"); fi

        # boolean flags
        if [ "${{ inputs.all }}" = "true" ]; then ARGS+=("--all"); fi

        # positional argument
        if [ -n "${{ inputs.component }}" ]; then ARGS+=("${{ inputs.component }}"); fi

        # short-flag aliases skipped: -o (--output)

        multicz release-notes "${ARGS[@]}" | tee /tmp/multicz-output.txt

        {
          echo "stdout<<EOF_STDOUT"
          cat /tmp/multicz-output.txt
          echo "EOF_STDOUT"
        } >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.output }}" = "json" ]; then
          {
            echo "json<<EOF_JSON"
            cat /tmp/multicz-output.txt
            echo "EOF_JSON"
          } >> "$GITHUB_OUTPUT"
        fi
