name: 'multicz config'
description: 'Run `multicz config` with structured inputs and outputs.'
author: 'Chris <goabonga@pm.me>'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  output:
    description: 'toml | json [default: toml]. (--output)'
    required: false
    default: ''
  component:
    description: 'Restrict to a single component (project table is still shown). (--component)'
    required: false
    default: ''
  source:
    description: 'Print the loaded config path on stderr. (--source, boolean)'
    required: false
    default: 'false'

  multicz-version:
    description: 'multicz version to install if not already on PATH (PyPI specifier, or "latest")'
    required: false
    default: 'latest'

outputs:
  stdout:
    description: "Raw stdout from the multicz invocation (TOML by default, JSON when output: json)"
    value: ${{ steps.run.outputs.stdout }}
  json:
    description: "JSON payload (only set when output: json)"
    value: ${{ steps.run.outputs.json }}

runs:
  using: 'composite'
  steps:
    - name: Ensure multicz is installed
      shell: bash
      run: |
        if ! command -v multicz >/dev/null 2>&1; then
          echo "multicz not on PATH - installing via uv"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ inputs.multicz-version }}" = "latest" ]; then
            uv tool install multicz
          else
            uv tool install "multicz==${{ inputs.multicz-version }}"
          fi
        fi
        multicz --version

    - name: Run multicz config
      id: run
      shell: bash
      run: |
        set -euo pipefail
        ARGS=()

        # value flags
        if [ -n "${{ inputs.output }}" ]; then ARGS+=("--output" "${{ inputs.output }}"); fi
        if [ -n "${{ inputs.component }}" ]; then ARGS+=("--component" "${{ inputs.component }}"); fi

        # boolean flags
        if [ "${{ inputs.source }}" = "true" ]; then ARGS+=("--source"); fi

        # short-flag aliases skipped: -o (--output), -c (--component)

        multicz config "${ARGS[@]}" | tee /tmp/multicz-output.txt

        {
          echo "stdout<<EOF_STDOUT"
          cat /tmp/multicz-output.txt
          echo "EOF_STDOUT"
        } >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.output }}" = "json" ]; then
          {
            echo "json<<EOF_JSON"
            cat /tmp/multicz-output.txt
            echo "EOF_JSON"
          } >> "$GITHUB_OUTPUT"
        fi
